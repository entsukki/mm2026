name: Päivitä MM 2026 tulokset

on:
  schedule:
    # Vartin välein (minuutit 7, 22, 37, 52 - tasaminuutit ovat GitHubin ruuhka-aikaa)
    - cron: '7-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tulokset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hae tulokset (FIFA API + TheSportsDB-ristiintarkistus)
        run: python3 hae_tulokset.py

      - name: Commitoi ja pushaa jos tulokset muuttuivat
        run: |
          if git diff --quiet tulokset.json; then
            echo "Ei uusia tuloksia - ei committia."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tulokset.json
            git commit -m "Päivitä tulokset automaattisesti"
            git push
          fi
