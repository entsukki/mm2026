name: Päivitä MM 2026 tulokset

on:
  schedule:
    # Varakeino. HUOM: GitHub throttlaa schedule-triggeriä rajusti (todelliset ajot 1-6 h välein,
    # ei 15 min). Ensisijainen herätin on ulkoinen cron (cron-job.org) joka kutsuu workflow_dispatchia
    # ~5 min välein - sitä ei throttlata samoin. Minuutit 7,22,37,52 = pois GitHubin ruuhka-ajalta.
    - cron: '7-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tulokset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hae tulokset (FIFA API + TheSportsDB-ristiintarkistus)
        run: python3 hae_tulokset.py

      - name: Hae pudotusvaiheen otteluohjelma (FIFA API)
        run: python3 hae_otteluohjelma.py

      - name: Commitoi ja pushaa jos tulokset tai otteluohjelma muuttuivat
        run: |
          if git diff --quiet tulokset.json otteluohjelma.json; then
            echo "Ei muutoksia - ei committia."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tulokset.json otteluohjelma.json
            git commit -m "Päivitä tulokset ja otteluohjelma automaattisesti"
            git push
          fi
