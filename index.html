<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a18; min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e0dfd8; padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 500; }
  header span { font-size: 13px; color: #888; }
  main { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .filter-btn { font-size: 13px; padding: 6px 16px; border-radius: 999px; border: 1px solid #ccc; background: #fff; color: #555; cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { border-color: #999; }
  .filter-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; font-weight: 500; }
  .day-group { margin-bottom: 1.75rem; }
  .day-header { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.07em; padding: 0 0 8px; border-bottom: 1px solid #e0dfd8; margin-bottom: 4px; }
  .match-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 8px; transition: background 0.1s; }
  .match-row:hover { background: #eceae3; }
  .time { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; color: #1a1a18; }
  .match-name { font-size: 15px; color: #1a1a18; }
  .badge { font-size: 12px; font-weight: 500; padding: 3px 11px; border-radius: 999px; white-space: nowrap; }
  .badge-mtv { background: #fdeee8; color: #8b3315; }
  .badge-yle { background: #e0f5ec; color: #0a6644; }
  .no-results { color: #888; font-size: 14px; padding: 1rem 0; }
  footer { text-align: center; font-size: 12px; color: #aaa; padding: 2rem 0 1rem; }
  @media (max-width: 480px) {
    .match-name { font-size: 14px; }
    .time { font-size: 14px; }
  }
</style>

let currentFilter = 'all';

function filter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const filtered = currentFilter === 'all' ? matches : matches.filter(m => m.ch === currentFilter);
  const groups = {};
  filtered.forEach(m => {
    if (!groups[m.date]) groups[m.date] = [];
    groups[m.date].push(m);
  });
  const el = document.getElementById('schedule');
  if (!filtered.length) { el.innerHTML = '<p class="no-results">Ei otteluita valitulla suodattimella.</p>'; return; }
  el.innerHTML = Object.entries(groups).map(([date, ms]) => `
    <div class="day-group">
      <div class="day-header">${date}</div>
      ${ms.map(m => `
        <div class="match-row">
          <span class="time">${m.time}</span>
          <span class="match-name">${m.match}</span>
          <span class="badge ${m.ch === 'MTV' ? 'badge-mtv' : 'badge-yle'}">${m.ch === 'MTV' ? 'MTV3' : 'Yle TV2'}</span>
        </div>
      `).join('')}
    </div>
  `).join('');
}
render();
